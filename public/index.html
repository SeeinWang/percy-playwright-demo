<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Percy Demo</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="card">
    <h1>订阅我们的周报</h1>
    <p class="lead">每周一封，随时可以退订。</p>

    <form id="signup" novalidate>
      <label for="email">邮箱</label>
      <input id="email" type="email" placeholder="you@example.com" />
      <p id="error" class="error" hidden>请输入有效的邮箱地址</p>

      <div class="actions">
        <button id="primary-btn" type="submit" class="btn btn-primary">订阅</button>
        <button id="secondary-btn" type="button" class="btn btn-secondary">以后再说</button>
      </div>
    </form>

    <p id="success" class="success" hidden>订阅成功 🎉</p>
  </main>
  <script src="app.js"></script>
</body>
</html>
