name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Visual: Playwright drives the page, Percy snapshots and compares it.
  # Behaviour assertions in these tests still fail the job.
  percy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run Playwright under Percy
        run: npx percy exec -- npx playwright test --grep-invert @a11y
        env:
          PERCY_TOKEN: ${{ secrets.PERCY_TOKEN }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/

  # Keyboard accessibility: plain Playwright, no Percy.
  a11y:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --grep @a11y
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: a11y-report
          path: playwright-report/
